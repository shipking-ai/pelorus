name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to commit SHAs (tag shown in the comment); Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Dependency audit (production)
        run: npm run audit
      - name: Licence gate (fails on unknown production licences)
        run: node scripts/license-inventory.js
      - name: Website tests (static checks, axe, responsive layout, Toolbox) in Chrome
        run: npm run site:test
      # One file at a time with a 60 s per-test limit: a hang in one test shows up as a failure with the other files' results
      # still visible, instead of a silent 20-minute stall.
      - name: End-to-end tests (includes axe accessibility scan and badssl.com TLS tests)
        timeout-minutes: 20
        shell: bash
        run: |
          failed=0
          for f in test/e2e/*.test.js; do echo "::group::$f"; node --test --test-force-exit --test-timeout=60000 "$f" || { echo "FILE FAILED: $f"; failed=1; }; echo "::endgroup::"; done
          exit $failed
      - name: Package
        run: npm run package
      - name: Packaged-app smoke test
        run: node scripts/verify-package.js
      - name: Installer builds
        run: npm run installer
      - name: SBOM (CycloneDX, production dependencies)
        run: npm sbom --sbom-format cyclonedx --omit dev > pelorus-sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pelorus-ci-${{ github.sha }}
          path: |
            pelorus-sbom.cdx.json
            docs/benchmarks/a11y-axe-latest.json
          if-no-files-found: error
          retention-days: 14

  # Linux and macOS: unit + end-to-end tests only. Pelorus is developed and packaged on Windows; these jobs exist to find
  # out what does and does not work elsewhere. Failures here are information, not yet a gate (continue-on-error).
  other-platforms:
    name: ${{ matrix.os }} tests (informational)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Linux - make Chromium's sandbox usable on the runner
        if: runner.os == 'Linux'
        run: |
          node -e "console.log('electron binary:', require('electron'))"
          ls node_modules/electron/dist | head -20
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Can the app start? (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        continue-on-error: true
        run: xvfb-run -a node scripts/launch-probe.js
      - name: Can the app start? (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 3
        continue-on-error: true
        run: node scripts/launch-probe.js
      # Each e2e file runs separately with a short per-test timeout so that one hanging test cannot hide the rest, and the
      # results of every file are printed as soon as that file finishes. Failures do not fail this informational job.
      - name: End-to-end tests (Linux, virtual display)
        if: runner.os == 'Linux'
        timeout-minutes: 25
        run: |
          for f in test/e2e/*.test.js; do echo "::group::$f"; xvfb-run -a node --test --test-force-exit --test-timeout=120000 "$f" || echo "FILE FAILED: $f"; echo "::endgroup::"; done
      - name: End-to-end tests (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 25
        run: |
          for f in test/e2e/*.test.js; do echo "::group::$f"; node --test --test-force-exit --test-timeout=120000 "$f" || echo "FILE FAILED: $f"; echo "::endgroup::"; done
